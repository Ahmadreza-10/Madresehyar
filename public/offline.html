<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>آفلاین | مدرسه‌یار</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif; background: #f4f6fb; color: #172033; text-align: center; }
  .card { max-width: 380px; background: #fff; border-radius: 24px; padding: 32px 24px; box-shadow: 0 14px 40px rgba(23,32,51,.12); }
  .ico { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 24px; background: linear-gradient(135deg, #4f46e5, #6366f1); display: grid; place-items: center; font-size: 2.6rem; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; } p { margin: 0 0 20px; line-height: 2; color: #55607a; font-size: .95rem; }
  button { font: inherit; font-weight: 700; font-size: 1rem; min-height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #4f46e5; color: #fff; cursor: pointer; width: 100%; }
  @media (prefers-color-scheme: dark) { body { background: #0b1020; color: #e8ecf8; } .card { background: #151b30; } p { color: #9aa6c4; } }
</style>
</head>
<body>
  <main class="card">
    <div class="ico" aria-hidden="true">📡</div>
    <h1>اینترنت قطع است</h1>
    <p>به سرور مدرسه‌یار وصل نشدیم. اتصال اینترنت یا Wi‑Fi گوشی‌تان را بررسی کنید و دوباره امتحان کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
